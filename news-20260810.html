    <h1 class="article-title">教務處：客座教授系列講座預告</h1>
    <div class="article-meta">發佈時間：2026年08月10日 | 分類：學術與經典</div>
    <img src="研修功坊5.jpg" alt="研修功坊" class="article-image">
    <div class="article-content">
      <p>為深化學術交流，本院教務處將於下個月隆重推出「道法自然與現代科學」客座教授系列講座。</p>
      <p>我們特別邀請了國內外知名高校的宗教學系及哲學系教授，針對《道德經》的當代詮釋、魏晉玄學的倫理觀念，以及傳統道醫與現代生命科學的對話等主題進行深入探討。</p>
      <p>講座將於每週六下午在研修功坊舉行。歡迎所有在校學子及對道家文化有興趣的社會人士報名旁聽。詳細的講者名單與場次表，將於近日於學院佈告欄及網站更新，敬請期待。</p>
    </div>
