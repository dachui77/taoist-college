  <header>
    <a href="index.html" class="logo">

  <main class="article-container">
    <h1 class="article-title">2026年度春季开学典礼圆满举行</h1>
    <div class="article-meta">发布时间：2026年09月01日 | 分类：院务公开</div>
    <img src="开学典礼3.jpg" alt="开学典礼现场" class="article-image">
    <div class="article-content">
      <p>本院于今日上午在主殿广场举行春季开学典礼，感谢各界贤达莅临指导。本次典礼标志着新一批学子正式踏上寻道与求学的旅程。</p>
      <p>院长在致辞中强调了「传承道法、弘扬学术」的核心理念，并勉励新生在未来的修学时光中，能够静心研习经典，将古老的智慧应用于现代生活之中。</p>
      <p>典礼结束后，新生们在导师的带领下参观了藏经书阁与静修精舍，为即将开始的学术与修行生活做好了准备。</p>
    </div>
  </main>
