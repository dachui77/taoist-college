<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖文介紹模塊測試</title>
  <style>
    /* 網頁基礎設定 (可選，讓畫面更好看) */
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "微軟正黑體", sans-serif;
      padding: 20px;
    }

    /* 模塊外框設計：使用 Flexbox 讓圖文左右排列 */
    .info-module {
      display: flex;
      align-items: center; /* 垂直置中 */
      gap: 30px; /* 圖文之間的間距 */
      padding: 20px;
      background-color: #f8f9fa; /* 淺灰背景 */
      border-radius: 8px; /* 圓角效果 */
      margin: 20px auto;
      max-width: 1000px; /* 限制整體最大寬度居中 */
    }

    /* 圖片區塊設定 */
    .image-section img {
      width: 100%;
      max-width: 400px; /* 限制圖片最大寬度 */
      height: auto;
      border-radius: 6px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* 增加輕微陰影 */
    }

    /* 文字區塊設定：自動填滿剩餘空間 */
    .text-section {
      flex: 1;
    }

    .text-section h3 {
      margin-top: 0;
      color: #333;
      font-size: 24px;
    }

    .text-section p {
      color: #555;
      line-height: 1.6;
    }

    /* 響應式設計：螢幕寬度小於 768px (手機版) 時，改為上下排列 */
    @media (max-width: 768px) {
      .info-module {
        flex-direction: column;
        text-align: center; /* 讓文字與標題置中 */
      }
    }
  </style>
</head>
<body>

  <!-- 圖文介紹模塊開始 -->
  <div class="info-module">
    <div class="image-section">
      <!-- 這裡的 src 已替換為測試用的佔位圖，請自行修改為您的圖片路徑 -->
      <img src="https://via.placeholder.com/400x300?text=Your+Image+Here" alt="圖片介紹內容">
    </div>
    <div class="text-section">
      <h3>這裡輸入模塊標題</h3>
      <p>這裡填寫您的詳細介紹文字內容。這是一個具備響應式設計的圖文排版模塊，在電腦版螢幕上會左右並排，在手機版螢幕上會自動轉換為上下排列。您可以根據實際需求自由修改此處的文字、替換左側圖片，以及調整整體樣式。</p>
    </div>
  </div>
  <!-- 圖文介紹模塊結束 -->

</body>
</html>
