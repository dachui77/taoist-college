    <h1 class="article-title">《道藏》文獻數字化工程啟動</h1>
    <div class="article-meta">發佈時間：2026年08月15日 | 分類：學術交流</div>
    <img src="scripture-library.jpg" alt="藏經書閣" class="article-image">
    <div class="article-content">
      <p>為更好地保存與傳承道教經典，本院於今日正式啟動古籍文獻數字化掃描工程。</p>
      <p>藏經書閣內珍藏的諸多明清時期《道藏》孤本與手抄經卷，將透過高精度的無損掃描技術轉換為數位檔案。此舉不僅能避免實體古籍因頻繁翻閱而受損，更能為海內外的宗教學與歷史學研究者提供更便捷的線上查閱管道。</p>
      <p>本工程預計將於年底完成首批 500 卷核心經卷的建檔工作，並於明年春季逐步向公眾開放線上檢索系統。</p>
    </div>
