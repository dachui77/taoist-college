<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>院務公開 & 最新動態 | 三清宮道教學院</title>
  <style>
    /* 引入與首頁相同的基礎樣式 */
    :root { --primary-color: #2c3e50; --bg-color: #fcfbf9; --text-main: #333; --accent-color: #4a5d4e; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "PingFang SC", "Microsoft YaHei", serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    .en-text { display: block; font-size: 0.9em; color: #7f8c8d; margin-top: 4px; font-weight: normal; }
    
    /* 導航欄樣式 */
    header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.04); }
    .logo { display: flex; align-items: center; gap: 15px; color: var(--primary-color); font-size: 1.5rem; font-weight: bold; }
    .logo-img { height: 50px; }
    
    /* 動態列表專屬樣式 */
    .news-container { max-width: 800px; margin: 60px auto; padding: 0 20px; min-height: 60vh; }
    .page-title { text-align: center; font-size: 2.2rem; color: var(--primary-color); margin-bottom: 40px; border-bottom: 2px solid var(--accent-color); padding-bottom: 15px; }
    .news-item { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; border-left: 5px solid var(--accent-color); }
    .news-item h3 { font-size: 1.3rem; margin-bottom: 10px; color: var(--primary-color); }
    .news-date { color: #888; font-size: 0.9em; margin-bottom: 15px; }
    .news-content { color: #555; }
    
    /* 頁腳 */
    footer { background: var(--primary-color); color: #ccc; text-align: center; padding: 40px 5%; margin-top: 60px; }
    
    /* 手機適配 */
    @media(max-width: 768px) {
      header { flex-direction: column; gap: 15px; }
      .news-container { margin: 30px auto; }
      .page-title { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <!-- 簡化版導航欄，方便返回首頁 -->
  <header>
    <a href="index.html" class="logo">
      <img src="sanqing-logo.png" alt="三清宮" class="logo-img">
      返回學院首頁
    </a>
  </header>

  <!-- 最新動態內容區 -->
  <div class="news-container">
    <h1 class="page-title">院務公開 & 最新動態</h1>

    <!-- 未來要新增公告，只需複製下方整個 <div class="news-item"> 區塊並修改文字即可 -->
    
    <div class="news-item">
      <h3>2026年度春季開學典禮圓滿舉行</h3>
      <div class="news-date">發佈日期：2026-09-01</div>
      <div class="news-content">
        <p>本院於今日上午在主殿廣場舉行春季開學典禮，感謝各界賢達蒞臨指導...</p>
      </div>
    </div>

    <div class="news-item">
      <h3>關於更新秋季作息安排的通知</h3>
      <div class="news-date">發佈日期：2026-08-28</div>
      <div class="news-content">
        <p>因應季節變化，自下週一起，晨鐘時間調整為清晨 5:30，請各位修學生留意最新作息表。</p>
      </div>
    </div>

    <div class="news-item">
      <h3>《道藏》文獻數字化工程啟動</h3>
      <div class="news-date">發佈日期：2026-08-15</div>
      <div class="news-content">
        <p>為更好地保存與傳承道教經典，本院正式啟動古籍文獻數字化掃描工程，預計將於年底完成首批經卷建檔。</p>
      </div>
    </div>

  </div>

  <footer>
    <p>© 1922 三清宮道教學院 · 保留所有權利</p>
  </footer>

</body>
</html>
